name: Release DOM.OS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version e.g. 6.1.2"
        required: true

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Set requested DOM.OS version
        run: node scripts/set-version.mjs "${{ github.event.inputs.version }}"

      - name: Validate DOM.OS
        run: npm run validate

      - name: Test DOM.OS workflows
        run: npm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: DOM.OS v${{ github.event.inputs.version }}
          releaseBody: |
            - Work Deadlines includes undated upcoming tasks; removed Open Finances button.
            - Finance edit/delete and bill paid controls; consistent payday-cycle spending and budgets.
            - Cancelled editors no longer save placeholder tasks, events or templates.
            - Midnight timer tracking and truthful weather refresh status.
            - Broader cross-window synchronization with conflict protection for concurrent saves.
            - Stronger form and backup validation, backup rollback, and literal text rendering.
            - Clear updater states and inline download/install progress.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
